### general
vo=gpu
#gpu-api=d3d11
video-sync=display-resample
video-sync-max-video-change=5
vd-lavc-dr=yes
hwdec=nvdec
hwdec-codecs=none
fullscreen
watch-later-options-remove=fullscreen
deinterlace=no
target-prim=auto
target-trc=auto
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=3
vulkan-swap-mode-fifo
video-output-levels=full
reset-on-next-file=audio-delay,mute,pause,speed,sub-delay,video-aspect-override,vieo-pan-x,video-pan-y,video-rotate,video-zoom,volume,fullscreen
save-position-on-quit
profile=gpu-hq

### ui
border=yes
msg-color=yes
term-osd-bar=yes
no-hidpi-window-scale
force-window=immediate
cursor-autohide=1000
fullscreen=no


### Dither
dither-depth=auto
temporal-dither=yes
dither=fruit
dither-size-fruit=2

### Debanding
# smooths out colour gradients but reduces detail
deband=no
#deband-iterations=4
#deband-treshold=48
#deband-range=16
#deband-grain=0

### Subtitles
blend-subtitles=yes
subs-with-matching-audio=no
slang=eng

### Scaling
# default is bspline but can be blurry which can be improved by ewa_lanzcos upscaling which is prone to causing ringing which can be reduced by the scale blur settings.
scale=mitchell
cscale=mitchell
#scale=ewa_lanzcos
#cscale=ewa_lanzcos
dscale=mitchell
sigmoid-upscaling=no
correct-downscaling=yes
linear-downscaling=no
linear-upscaling=no
scaler-rsizes-only=yes
#scale-blur=0.981251
#cscale-blur=0.981251
scale-param1=1
scale-param2=0
cscale-param1=1
cscale-param2=0
dscale-param1=1
dscale-param2=0
#scale-antiringing=0.7 # luma upscale deringing
#dscale-antiringing=0.7 # luma downscale deringing
#cscale-antiringing=0.7 # chroma upscale deringing

### Audio
audio-stream-silence=no
audio-normalize-downmix=yes
audio-resample-linear=yes
audio-channels=auto-safe
ad-lavc-downmix=yes
alang=jpn,kor,en
